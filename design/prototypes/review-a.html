<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reviews A, by deadline · ICG desk</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../tokens.css">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../tailwind.config.js"></script>
  <link rel="stylesheet" href="desk.css">
  <script>window.DESK_ROLE = 'reviewer';</script>
  <script src="desk.js"></script>
  <script src="desk-review.js"></script>
  <style id="rv-css"></style>
  <style>
    /*
     * Reviews A: by deadline. The queue is an agenda: each review sits on the day
     * it is needed by (an event, a sign-up date), with the day as an Anton numeral,
     * so the reviewer works the calendar the way the site does. Opening one shows
     * the article beside your earlier requests and the decision.
     */
    .q-layout { margin-top: 32px; display: grid; gap: 32px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 1024px) { .q-layout { grid-template-columns: minmax(0, 1fr) 340px; gap: 48px; align-items: start; } }
    .day { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 16px; padding: 20px 0; border-top: 1px solid var(--color-rule); }
    .day:first-child { border-top: 3px solid var(--color-ink); }
    @media (min-width: 768px) { .day { grid-template-columns: 72px minmax(0, 1fr); gap: 24px; } }
    .day .num { font-size: 40px; }          /* numeral-agenda-sm */
    .day .wd { margin-top: 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--color-ink-muted); }
    .day .nodate { font-size: 15px; font-weight: 700; padding-top: 8px; }
    .items { display: grid; gap: 8px; }
    .item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 16px; align-items: center; padding: 16px; background: var(--color-card); border-radius: var(--radius-sm); color: inherit; }
    a.item:hover { background: var(--color-card-hover); }
    a.item:hover .t-row { text-decoration: underline; text-underline-offset: 4px; }
    .item .why { margin-top: 6px; font-size: 13px; color: var(--color-ink); font-weight: 600; }
    @media (max-width: 639px) { .item { grid-template-columns: minmax(0, 1fr); } }
    .ruled { border-top: 3px solid var(--color-ink); padding-top: 12px; }
    .done-row { padding: 12px 0; }
    .done-row + .done-row { border-top: 1px solid var(--color-rule); }

    .rv-layout { display: grid; gap: 32px; grid-template-columns: minmax(0, 1fr); padding: 24px 16px 48px; }
    @media (min-width: 1024px) { .rv-layout { grid-template-columns: minmax(0, 1fr) 380px; gap: 48px; padding: 40px; align-items: start; } .rv-side { position: sticky; top: 104px; } }
    .req { display: flex; gap: 12px; padding: 12px 0; }
    .req + .req { border-top: 1px solid var(--color-rule); }
    .req .mk { flex: none; width: 22px; height: 22px; border-radius: 999px; background: var(--color-ink); color: var(--color-paper); display: grid; place-items: center; }
  </style>
</head>
<body class="bg-paper text-ink font-body antialiased">
  <main id="desk-main">
    <div id="queue" class="desk-content fluid">
      <header class="ov-head">
        <div><h1 class="t-section">Reviews</h1><p class="ov-sub" id="sub"></p></div>
      </header>
      <div class="q-layout">
        <section aria-label="Waiting for you, by the date each is needed" data-component="DeadlineAgenda" id="agenda"></section>
        <aside class="ruled" aria-labelledby="done-h" data-component="RecentDecisions">
          <h2 id="done-h" class="t-h2">Decided recently</h2>
          <div id="decided" class="mt-1"></div>
        </aside>
      </div>
    </div>
    <div id="review" hidden></div>
  </main>

  <script>
    const { $, esc, icon, badge, mount, toast, plainDate, DAYS, MONTHS, parse } = window.Desk;
    const { REVIEWS, DECIDED, KIND, neededLine, articleHTML, decisionHTML, wireDecision, ASK_CSS } = window.Review;
    $('rv-css').textContent = ASK_CSS;
    mount({ current: 'reviews', title: 'Reviews' });

    function queue() {
      const waiting = REVIEWS.filter(r => !r.done);
      $('sub').innerHTML = `${waiting.length} waiting<span class="dot-sep"></span>${waiting.filter(r => r.state === 'invited').length} new requests`;
      const groups = {};
      waiting.forEach(r => (groups[r.neededBy || 'none'] = groups[r.neededBy || 'none'] || []).push(r));
      const keys = Object.keys(groups).sort((a, b) => a === 'none' ? 1 : b === 'none' ? -1 : a.localeCompare(b));
      $('agenda').innerHTML = keys.map(k => {
        const d = k === 'none' ? null : parse(k);
        const head = d ? `<div aria-hidden="true"><p class="display num">${d.getDate()}</p><p class="wd">${DAYS[d.getDay()].slice(0, 3).toUpperCase()}</p></div>` : `<p class="nodate">No date</p>`;
        return `<div class="day"><h2 class="sr-only">${d ? `Needed by ${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}` : 'No date'}</h2>${head}<div class="items">${groups[k].map(item).join('')}</div></div>`;
      }).join('') || `<p class="py-6 text-[15px] text-ink-muted">Nothing is waiting for you.</p>`;
      $('decided').innerHTML = DECIDED.map(x => `<div class="done-row"><p class="t-row">${esc(x.title)}</p><p class="meta mt-1">${x.what}<span class="dot-sep"></span>${plainDate(x.on)}<span class="dot-sep"></span>${esc(x.writer)}</p><div class="mt-2">${badge(x.status)}</div></div>`).join('');
    }
    function item(r) {
      const meta = `<p class="meta"><span class="type">${r.type}</span><span class="dot-sep"></span>${esc(r.writer)}<span class="dot-sep"></span>${KIND(r)}</p>`;
      const why = r.why ? `<p class="why">${esc(r.why)}</p>` : '';
      if (r.state === 'invited') return `<div class="item" data-component="ReviewItem"><div class="min-w-0">${meta}<p class="t-row mt-1">${esc(r.title)}</p>${why}</div>
        <div class="flex gap-2"><button type="button" class="btn btn-day" data-accept="${r.id}">Accept</button><button type="button" class="btn btn-day" data-decline="${r.id}">Decline</button></div></div>`;
      return `<a href="?open=${r.id}" class="item" data-component="ReviewItem"><div class="min-w-0">${meta}<p class="t-row mt-1">${esc(r.title)}</p>${why}</div><span class="text-ink-muted">${icon('chevron', 20)}</span></a>`;
    }
    $('agenda').addEventListener('click', e => {
      const a = e.target.closest('[data-accept]'), d = e.target.closest('[data-decline]');
      if (a) { const r = REVIEWS.find(x => x.id === a.dataset.accept); r.state = 'accepted'; queue(); toast(`Accepted. “${r.title}” is in your queue.`); }
      if (d) { const r = REVIEWS.find(x => x.id === d.dataset.decline); r.done = true; queue(); toast(`Declined. ${r.writer.split(' ')[0]} will choose someone else.`); }
    });

    function review(id) {
      const r = REVIEWS.find(x => x.id === id); if (!r) return;
      $('queue').hidden = true; $('review').hidden = false;
      $('review').innerHTML = `<div class="editbar" data-component="ReviewBar"><a href="?" class="back">${icon('chevron', 18, 'style="transform:rotate(180deg)"')}Reviews</a>
          <h1 class="t-h2 sr-only sm:not-sr-only">Review</h1><span id="rv-badge">${badge('in_review')}</span><span class="saved">${neededLine(r)}</span></div>
        <div class="rv-layout">${articleHTML(r)}
          <aside class="rv-side space-y-8" aria-label="Your review">
            ${r.round > 1 ? `<section class="ruled"><h2 class="t-h2">${esc(r.writer)} sent it back</h2><p class="meta mt-1">${plainDate(r.sent)}, ${r.sentTime}</p><p class="mt-2 text-[15px]">“${esc(r.note)}”</p></section>
            <section class="ruled"><h2 class="t-h2">Your requests</h2>${r.requests.map(q => `<div class="req"><span class="mk" aria-hidden="true">${icon('approved', 14).replace('<circle cx="12" cy="12" r="8"/>', '')}</span><div><p class="font-semibold text-[15px]">${esc(q.text)}<span class="sr-only">, fixed</span></p><p class="meta mt-1">${esc(q.fix)}</p></div></div>`).join('')}</section>` : ''}
            <section class="ruled"><h2 class="t-h2">Your decision</h2><div class="mt-3" id="decide">${decisionHTML(r)}</div></section>
          </aside></div>`;
      wireDecision($('decide'), r, st => {
        r.done = true;
        $('rv-badge').innerHTML = badge(st === 'approved' ? 'approved' : 'draft');
        $('decide').innerHTML = `<p class="text-[15px]">${st === 'approved' ? 'You approved this.' : st === 'changes' ? `You sent it back to ${esc(r.writer.split(' ')[0])}.` : 'You stepped down.'}</p><a href="?" class="btn btn-day mt-4">Back to reviews</a>`;
      });
      document.title = `Review: ${r.title} · ICG desk`;
    }

    const open = new URLSearchParams(location.search).get('open');
    queue(); if (open) review(open);
  </script>
</body>
</html>
