<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview · ICG desk</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../tokens.css">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../tailwind.config.js"></script>
  <link rel="stylesheet" href="desk.css">
  <script src="public-data.js"></script>
  <script src="desk.js"></script>
  <script src="desk-review.js"></script>
  <script src="desk-admin-data.js"></script>
  <style>
    /*
     * Overview, the month desk (chosen 2026-11-15). The calendar is the way in, on the desk too:
     * a month of your own dated work (events, go-live times, publish days, review
     * hand-offs) beside ruled columns for the selected day and what needs you.
     * Uses the public calendar's vocabulary (DESIGN.md: Calendar).
     */
    .desk-content { container: month-desk / inline-size; }
    .month-layout { margin-top: 24px; display: grid; gap: 32px; }
    @media (min-width: 1024px) { .month-layout { margin-top: 32px; } }
    /* The sidebar reduces the actual work area; fit the calendar to that area. */
    @container month-desk (min-width: 64rem) { .month-layout { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; } }
    .month-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .nav-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 999px; border: 1px solid var(--color-ink); }
    .nav-btn:hover { background: var(--color-ink); color: var(--color-paper); }
    .grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .wdays div { padding: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--color-ink-muted); text-align: center; }
    @media (min-width: 768px) { .wdays div { text-align: left; padding-left: 10px; } }
    .cells { gap: 1px; background: var(--color-rule); border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--color-rule); }
    /* Seven 44px day targets need the screen width on the smallest phones. */
    @media (max-width: 359px) {
      .wdays, .cells { margin-inline: calc(-1 * var(--gutter)); width: calc(100% + 2 * var(--gutter)); }
      .cells { border-inline: 0; border-radius: 0; }
    }
    .cell { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 56px; padding: 6px 2px; background: var(--color-card); text-align: left; transition: background-color 150ms ease; }
    .cell:hover { background: var(--color-card-hover); }
    .cell.out { background: var(--color-paper); }
    .cell.out .n { color: var(--color-ink-faint); }
    .cell[aria-pressed="true"] { outline: 2px solid var(--color-ink); outline-offset: -2px; z-index: 1; }
    .cell:focus-visible { outline: 2px solid var(--color-ink); outline-offset: -4px; border-radius: 0; z-index: 2; }
    .n { font-size: 20px; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 999px; }  /* numeral-cell-sm */
    .cell.today .n { background: var(--color-marigold); color: var(--color-on-marigold); }
    .dots { display: flex; gap: 3px; }
    .dots i { width: 6px; height: 6px; border-radius: 999px; background: var(--color-ink); }
    .dots i.c { background: var(--color-ink-faint); }
    .chips, .campus { display: none; }
    @media (min-width: 768px) {
      .cell { align-items: stretch; min-height: 128px; padding: 8px 8px 10px; }
      .n { font-size: 26px; width: 40px; height: 40px; }  /* numeral-cell */
      .dots { display: none; }
      .chips { display: grid; gap: 4px; }
      .campus { display: block; margin-top: auto; font-size: 12px; color: var(--color-ink-muted); }
    }
    .chip-ev { display: block; padding: 4px 6px; border-radius: var(--radius-xs); font-size: 12px; line-height: 1.3; background: var(--color-paper); color: var(--color-ink); }
    .chip-ev b { font-weight: 600; display: block; }
    .chip-ev span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .chip-ev[data-status="in_review"] { background: var(--color-rule); }
    .chip-ev[data-status="approved"] { background: var(--color-surface-raised); color: var(--color-text-on-dark); }
    .chip-ev[data-status="published"] { background: var(--color-ink); color: var(--color-paper); }
    .chip-ev[data-kind="request"] { background: var(--color-card); border: 1px dashed var(--color-ink-muted); }
    .legend { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--color-ink-muted); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
    .legend .legend-desktop { display: none; }
    @media (min-width: 768px) {
      .legend .legend-desktop { display: inline-flex; }
      .legend .legend-mobile { display: none; }
    }

    .ruled { border-top: 3px solid var(--color-ink); padding-top: 16px; }
    /* On Mist the Draft badge takes Card White so its fill still shows. */
    .ruled .badge[data-status="draft"] { background: var(--color-card); }
    .ruled + .ruled { margin-top: 32px; }
    .day-item { display: block; padding: 16px 0; color: inherit; }
    .day-item + .day-item { border-top: 1px solid var(--color-rule); }
    .review-meta { font-size: 13px; line-height: 1.4; color: var(--color-ink-muted); }
    .review-kind { font-weight: 600; color: var(--color-ink); }
    .review-state { margin-top: 32px; }
    .review-state[hidden], .month-layout[hidden] { display: none; }
    .review-state .ph { margin-top: 16px; max-width: 480px; }
    .review-count { font-size: 15px; font-weight: 600; color: var(--color-ink-muted); }
    .review-entry { display: flex; align-items: center; gap: 12px; min-height: 44px; }
    .review-entry .entry-text { min-width: 0; flex: 1; }
    .invite-name { overflow-wrap: anywhere; }
    .review-entry svg { flex-shrink: 0; }
    a.day-item:hover .t-row { text-decoration: underline; text-underline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { .cell { transition: none; } }
  </style>
</head>
<body class="bg-paper text-ink font-body antialiased">
  <main id="desk-main">
    <div class="desk-content fluid">
      <header class="ov-head">
        <div>
          <h1 class="t-section" id="greeting">Good morning, Lea</h1>
          <p class="ov-sub" id="summary"></p>
        </div>
        <a href="dashboard-editor.html?id=new" class="btn btn-primary hidden lg:inline-flex" id="new-btn"></a>
      </header>

      <div id="overview-state" class="review-state" hidden></div>

      <div class="month-layout">
        <section aria-labelledby="month-heading" data-component="DeskMonth">
          <div class="month-bar">
            <h2 id="month-heading" class="t-h2 mr-auto" aria-live="polite"></h2>
            <button type="button" class="nav-btn" id="prev" aria-label="Previous month"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
            <button type="button" class="nav-btn" id="next" aria-label="Next month"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
          </div>
          <div class="grid7 wdays" aria-hidden="true"><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div></div>
          <div class="grid7 cells" id="cells"></div>
          <p class="legend" id="legend">
            <span><i style="background:var(--color-paper);border:1px solid var(--color-rule)"></i>Draft</span>
            <span><i style="background:var(--color-rule)"></i>In review</span>
            <span><i style="background:var(--color-surface-raised)"></i>Approved</span>
            <span><i style="background:var(--color-ink)"></i>Published</span>
            <span>Marigold circle: today</span>
          </p>
        </section>

        <div>
          <section class="ruled" aria-labelledby="day-heading" data-component="SelectedDay">
            <h2 id="day-heading" class="t-h2" tabindex="-1"></h2>
            <div id="day-list" class="mt-1" aria-live="polite"></div>
          </section>
          <section class="ruled" aria-labelledby="needs-heading" data-component="NeedsYou">
            <h2 id="needs-heading" class="t-h2">Needs you <span class="text-ink-muted font-semibold text-[15px]">1</span></h2>
            <div id="needs" class="mt-1"></div>
          </section>
          <section class="ruled" aria-labelledby="work-heading" data-component="PipelineCounts">
            <h2 id="work-heading" class="t-h2">Your work</h2>
            <div id="work" class="mt-1"></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="desk-overview.js"></script>
</body>
</html>
