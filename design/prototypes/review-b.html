<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reviews B, what changed · ICG desk</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../tokens.css">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../tailwind.config.js"></script>
  <link rel="stylesheet" href="desk.css">
  <script>window.DESK_ROLE = 'reviewer';</script>
  <script src="desk.js"></script>
  <script src="desk-review.js"></script>
  <style id="rv-css"></style>
  <style>
    /*
     * Reviews B: what changed. Most reviews are second reads, so the queue splits
     * by the kind of read (sent back to you, first reads, new requests) and the
     * review page marks exactly what the writer changed since your last review,
     * each change tied to the request it answers.
     */
    .cols { margin-top: 32px; display: grid; gap: 32px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 1024px) { .cols { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start; } }
    .ruled { border-top: 3px solid var(--color-ink); padding-top: 12px; }
    .col-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .col-head .count { font-size: 15px; font-weight: 600; color: var(--color-ink-muted); }
    .col-note { margin-top: 2px; font-size: 13px; color: var(--color-ink-muted); }
    .stack { margin-top: 14px; display: grid; gap: 8px; }
    .card { display: block; padding: 16px; background: var(--color-card); border-radius: var(--radius-sm); color: inherit; }
    a.card:hover { background: var(--color-card-hover); }
    a.card:hover .t-row { text-decoration: underline; text-underline-offset: 4px; }
    .card .foot { margin-top: 10px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--color-ink-muted); }
    .card .foot strong { color: var(--color-ink); }
    .empty-col { padding: 14px 0; font-size: 14px; color: var(--color-ink-muted); }

    .rv-layout { display: grid; gap: 32px; grid-template-columns: minmax(0, 1fr); padding: 24px 16px 48px; }
    @media (min-width: 1024px) { .rv-layout { grid-template-columns: minmax(0, 1fr) 380px; gap: 48px; padding: 40px; align-items: start; } .rv-side { position: sticky; top: 104px; } }
    .switch { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; font-weight: 600; }
    .switch .track { width: 40px; height: 24px; border-radius: 999px; background: var(--color-rule); position: relative; transition: background-color 150ms ease; }
    .switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 999px; background: var(--color-card); transition: transform 150ms ease; }
    .switch[aria-checked="true"] .track { background: var(--color-ink); }
    .switch[aria-checked="true"] .track::after { transform: translateX(16px); }
    .no-diff ins { background: none; text-decoration: none; padding: 0; }
    .chg { padding: 14px 0; }
    .chg + .chg { border-top: 1px solid var(--color-rule); }
    .chg .lbl { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
    .chg .lbl .ok { margin-left: auto; font-size: 13px; color: var(--color-ink-muted); font-weight: 600; }
    ins:focus-visible { outline: 2px solid var(--color-ink); outline-offset: 2px; }
    ins { scroll-margin-top: 140px; }
    @media (prefers-reduced-motion: reduce) { .switch .track, .switch .track::after { transition: none; } }
  </style>
</head>
<body class="bg-paper text-ink font-body antialiased">
  <main id="desk-main">
    <div id="queue" class="desk-content fluid">
      <header class="ov-head"><div><h1 class="t-section">Reviews</h1><p class="ov-sub" id="sub"></p></div></header>
      <div class="cols" id="cols" data-component="ReviewColumns"></div>
    </div>
    <div id="review" hidden></div>
  </main>

  <script>
    const { $, esc, icon, badge, mount, toast, plainDate } = window.Desk;
    const { REVIEWS, DECIDED, KIND, neededLine, articleHTML, decisionHTML, wireDecision, ASK_CSS } = window.Review;
    $('rv-css').textContent = ASK_CSS;
    mount({ current: 'reviews', title: 'Reviews' });

    function queue() {
      const waiting = REVIEWS.filter(r => !r.done);
      $('sub').innerHTML = `${waiting.length} waiting<span class="dot-sep"></span>${waiting.filter(r => r.round > 1).length} sent back to you`;
      const COLS = [
        ['Sent back to you', 'Second reads: check the fixes', waiting.filter(r => r.state === 'accepted' && r.round > 1)],
        ['First reads', 'Accepted, not read yet', waiting.filter(r => r.state === 'accepted' && r.round === 1)],
        ['New requests', 'Accept or decline', waiting.filter(r => r.state === 'invited')],
      ];
      $('cols').innerHTML = COLS.map(([name, note, list]) => `<section class="ruled" aria-label="${name}">
        <div class="col-head"><h2 class="t-h2">${name} <span class="count">${list.length}</span></h2></div><p class="col-note">${note}</p>
        <div class="stack">${list.map(card).join('') || '<p class="empty-col">Nothing here.</p>'}</div></section>`).join('');
    }
    function card(r) {
      const top = `<p class="meta"><span class="type">${r.type}</span><span class="dot-sep"></span>${esc(r.writer)}</p><p class="t-row mt-1">${esc(r.title)}</p>`;
      const need = `<span>${neededLine(r)}</span>`;
      if (r.state === 'invited') return `<div class="card" data-component="ReviewCard">${top}<p class="foot">${icon('calendar', 16)}${need}</p>
        <div class="flex gap-2 mt-4"><button type="button" class="btn btn-day" data-accept="${r.id}">Accept</button><button type="button" class="btn btn-day" data-decline="${r.id}">Decline</button></div></div>`;
      const fixed = r.round > 1 ? `<p class="foot">${icon('approved', 16)}<span><strong>${r.requests.length} of ${r.requests.length}</strong> requests fixed</span></p>` : '';
      return `<a href="?open=${r.id}" class="card" data-component="ReviewCard">${top}${fixed}<p class="foot">${icon('calendar', 16)}${need}</p></a>`;
    }
    $('cols').addEventListener('click', e => {
      const a = e.target.closest('[data-accept]'), d = e.target.closest('[data-decline]');
      if (a) { const r = REVIEWS.find(x => x.id === a.dataset.accept); r.state = 'accepted'; queue(); toast(`Accepted. “${r.title}” moved to First reads.`); }
      if (d) { const r = REVIEWS.find(x => x.id === d.dataset.decline); r.done = true; queue(); toast(`Declined. ${r.writer.split(' ')[0]} will choose someone else.`); }
    });

    function review(id) {
      const r = REVIEWS.find(x => x.id === id); if (!r) return;
      $('queue').hidden = true; $('review').hidden = false;
      const second = r.round > 1;
      $('review').innerHTML = `<div class="editbar" data-component="ReviewBar"><a href="?" class="back">${icon('chevron', 18, 'style="transform:rotate(180deg)"')}Reviews</a>
          <h1 class="t-h2 sr-only sm:not-sr-only">Review</h1><span id="rv-badge">${badge('in_review')}</span><span class="saved">${neededLine(r)}</span>
          ${second ? `<button type="button" class="switch ml-auto" role="switch" aria-checked="true" id="diff"><span class="track" aria-hidden="true"></span>Show what changed</button>` : ''}</div>
        <div class="rv-layout"><div id="doc">${articleHTML(r, { diff: second })}</div>
          <aside class="rv-side space-y-8" aria-label="Your review">
            ${second ? `<section class="ruled" data-component="ChangesSinceReview"><h2 class="t-h2">Since your last review</h2>
              <p class="meta mt-1">${esc(r.writer)} sent it back ${plainDate(r.sent)}, ${r.sentTime}: “${esc(r.note)}”</p>
              ${r.requests.map((q, i) => `<div class="chg"><p class="lbl">${esc(q.text)}<span class="ok">Fixed</span></p><p class="mt-1 text-[14px] text-ink-muted">${esc(q.fix)}</p>
                <button type="button" class="link text-[14px] mt-2" data-show="${q.target}">Show the change</button></div>`).join('')}</section>` : ''}
            <section class="ruled"><h2 class="t-h2">Your decision</h2><div class="mt-3" id="decide">${decisionHTML(r)}</div></section>
          </aside></div>`;
      $('diff')?.addEventListener('click', e => {
        const on = e.currentTarget.getAttribute('aria-checked') !== 'true';
        e.currentTarget.setAttribute('aria-checked', String(on)); $('doc').classList.toggle('no-diff', !on);
      });
      $('review').addEventListener('click', e => {
        const b = e.target.closest('[data-show]'); if (!b) return;
        const el = b.dataset.show === 'venue' ? $('venue-ins') : $('doc').querySelector('.rv-body ins');
        if ($('diff').getAttribute('aria-checked') !== 'true') $('diff').click();
        el.setAttribute('tabindex', '-1'); el.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); el.focus({ preventScroll: true });
      });
      wireDecision($('decide'), r, st => {
        r.done = true;
        $('rv-badge').innerHTML = badge(st === 'approved' ? 'approved' : 'draft');
        $('decide').innerHTML = `<p class="text-[15px]">${st === 'approved' ? 'You approved this.' : st === 'changes' ? `You sent it back to ${esc(r.writer.split(' ')[0])}.` : 'You stepped down.'}</p><a href="?" class="btn btn-day mt-4">Back to reviews</a>`;
      });
      document.title = `Review: ${r.title} · ICG desk`;
    }
    const open = new URLSearchParams(location.search).get('open');
    queue(); if (open) review(open);
  </script>
</body>
</html>
